name: Triage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Top-level defaults are read-only; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  collect-and-classify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      pull_number: ${{ steps.classify.outputs.pull_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore triage state
        uses: actions/cache/restore@v4
        with:
          path: .triage
          key: triage-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            triage-state-${{ github.repository }}-

      - name: Install triage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect evidence from failed CI run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundles
          triage collect run "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --out bundles

      - name: Classify and draft
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=$(find bundles -name evidence_bundle.json | head -n 1)
          test -n "$BUNDLE"
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/pull-requests" --jq '.[0].number // empty')
          echo "pull_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          triage run --bundle "$BUNDLE" --out bundles/verdicts.json --drafts bundles/drafts.json --engine rules --no-verify

      - name: Save triage state
        if: steps.classify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .triage
          key: triage-state-${{ github.repository }}-${{ github.run_id }}

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-artifacts
          path: |
            bundles/
            .triage/
          if-no-files-found: warn

  publish:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    needs: collect-and-classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install triage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download triage artifacts
        uses: actions/download-artifact@v4
        with:
          name: triage-artifacts
          path: .

      - name: Publish drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f bundles/drafts.json
          ARGS=(--drafts bundles/drafts.json --repo "${{ github.repository }}")
          PR_NUMBER="${{ needs.collect-and-classify.outputs.pull_number }}"
          if [ -n "$PR_NUMBER" ]; then
            ARGS+=(--pull "$PR_NUMBER")
          fi
          triage publish "${ARGS[@]}"

      - name: Upload publish audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-publish-audit
          path: .triage/audit.jsonl
          if-no-files-found: ignore
