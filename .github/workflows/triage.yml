name: Triage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install triage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect evidence from failed CI run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundles
          triage collect run "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --out bundles

      - name: Classify and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=$(find bundles -name evidence_bundle.json | head -n 1)
          test -n "$BUNDLE"
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/pull-requests" --jq '.[0].number // empty')
          ARGS=(--bundle "$BUNDLE" --out bundles/verdicts.json --drafts bundles/drafts.json --engine rules --no-verify --publish)
          if [ -n "$PR_NUMBER" ]; then
            ARGS+=(--pull "$PR_NUMBER")
          fi
          triage run "${ARGS[@]}"

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-artifacts
          path: |
            bundles/
          if-no-files-found: warn
