name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://shop:shop@127.0.0.1:5432/shop?connect_timeout=5
  USE_SHARED_DB: "1"
  PAYMENT_URL: http://127.0.0.1:8001
  PAYMENT_API_KEY: dev-token
  APP_LOG_PATH: logs/app.log

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"

      - name: Lint
        run: ruff check app triage faults tests/api

      - name: Type check
        run: mypy

      - name: Triage tests
        run: pytest -q tests/triage

      - name: Start Postgres and payment stub
        run: docker compose -p failure-triage --profile db --profile pay up -d --wait --build

      - name: Reset database
        run: python -m app.seed --reset

      - name: Test
        run: |
          mkdir -p test-results/api logs
          pytest -q tests/api --junitxml=test-results/api/junit.xml

      - name: Stop Compose services
        if: always()
        run: docker compose -p failure-triage --profile db --profile pay --profile app down -v

      - name: Upload API test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          path: |
            test-results/api/
            logs/app.log
          if-no-files-found: warn

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Postgres and payment stub
        working-directory: .
        run: docker compose -p failure-triage --profile db --profile pay up -d --wait --build

      - name: Reset database
        working-directory: .
        run: python -m app.seed --reset

      - name: UI tests
        run: npx playwright test

      - name: Stop Compose services
        if: always()
        working-directory: .
        run: docker compose -p failure-triage --profile db --profile pay --profile app down -v

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            tests/ui/test-results/
            tests/ui/playwright-report/
          if-no-files-found: warn
