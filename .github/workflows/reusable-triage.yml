# Reusable triage workflow for any repo that uploads pytest JUnit + Playwright JSON.
# Caller example lives in docs/onboarding.md and examples/second-repo/.github/workflows/.

name: Reusable triage

on:
  workflow_call:
    inputs:
      run-id:
        description: GitHub Actions run id to collect evidence from
        required: true
        type: string
      repository:
        description: owner/repo of the failed run (defaults to the caller repository)
        required: false
        type: string
        default: ""
      config-path:
        description: Path to triage.config.yaml in the caller repository
        required: false
        type: string
        default: triage.config.yaml
      engine:
        description: Classifier engine (rules or llm)
        required: false
        type: string
        default: rules
      verify:
        description: Enable allow-listed same-SHA / last-green reruns
        required: false
        type: boolean
        default: false
      python-version:
        description: Python version for the triage runner
        required: false
        type: string
        default: "3.13"
      install-mode:
        description: "How to install the agent: local (caller checkout) or git"
        required: false
        type: string
        default: git
      triage-repository:
        description: owner/repo that hosts the triage package (install-mode=git)
        required: false
        type: string
        default: atulsarje7-netizen/failureTriage-cicd
      triage-ref:
        description: Git ref of the triage package (install-mode=git)
        required: false
        type: string
        default: main
      dry-run-publish:
        description: Render publish output without creating issues or PR comments
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: Token with actions read plus issues/pull-requests write for publish
        required: true
      gemini-api-key:
        description: Optional Gemini key when engine=llm
        required: false
    outputs:
      pull_number:
        description: Pull request number linked to the failed run, when any
        value: ${{ jobs.collect-and-classify.outputs.pull_number }}

# Caller must grant the elevated job permissions below.
permissions:
  contents: read

jobs:
  collect-and-classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      pull_number: ${{ steps.classify.outputs.pull_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Restore triage state
        uses: actions/cache/restore@v4
        with:
          path: .triage
          key: triage-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            triage-state-${{ github.repository }}-

      - name: Install triage (local checkout)
        if: ${{ inputs.install-mode == 'local' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install triage (git package)
        if: ${{ inputs.install-mode != 'local' }}
        env:
          TRIAGE_REPOSITORY: ${{ inputs.triage-repository }}
          TRIAGE_REF: ${{ inputs.triage-ref }}
        run: |
          if [[ ! "$TRIAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "triage-repository must be owner/repo" >&2
            exit 1
          fi
          if [[ ! "$TRIAGE_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "triage-ref contains unsupported characters" >&2
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "failure-triage @ git+https://github.com/${TRIAGE_REPOSITORY}.git@${TRIAGE_REF}"

      - name: Collect evidence from failed CI run
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          REPOSITORY: ${{ inputs.repository }}
          RUN_ID: ${{ inputs.run-id }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run-id must be numeric" >&2
            exit 1
          fi
          mkdir -p bundles
          REPO="$REPOSITORY"
          if [ -z "$REPO" ]; then
            REPO="${GITHUB_REPOSITORY}"
          fi
          triage collect run "$RUN_ID" \
            --repo "$REPO" \
            --config "$CONFIG_PATH" \
            --out bundles

      - name: Classify and draft
        id: classify
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          GITHUB_TOKEN: ${{ secrets.github-token }}
          GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
          REPOSITORY: ${{ inputs.repository }}
          RUN_ID: ${{ inputs.run-id }}
          CONFIG_PATH: ${{ inputs.config-path }}
          ENGINE: ${{ inputs.engine }}
          VERIFY: ${{ inputs.verify }}
        run: |
          BUNDLE=$(find bundles -name evidence_bundle.json | head -n 1)
          test -n "$BUNDLE"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run-id must be numeric" >&2
            exit 1
          fi
          REPO="$REPOSITORY"
          if [ -z "$REPO" ]; then
            REPO="${GITHUB_REPOSITORY}"
          fi
          PR_NUMBER=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/pull-requests" --jq '.[0].number // empty')
          echo "pull_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          VERIFY_FLAG=--no-verify
          if [ "$VERIFY" = "true" ]; then
            VERIFY_FLAG=--verify
          fi
          triage run \
            --bundle "$BUNDLE" \
            --config "$CONFIG_PATH" \
            --out bundles/verdicts.json \
            --drafts bundles/drafts.json \
            --engine "$ENGINE" \
            "$VERIFY_FLAG"

      - name: Save triage state
        if: steps.classify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .triage
          key: triage-state-${{ github.repository }}-${{ github.run_id }}

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-artifacts
          path: |
            bundles/
            .triage/
          if-no-files-found: warn

  publish:
    needs: collect-and-classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install triage (local checkout)
        if: ${{ inputs.install-mode == 'local' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install triage (git package)
        if: ${{ inputs.install-mode != 'local' }}
        env:
          TRIAGE_REPOSITORY: ${{ inputs.triage-repository }}
          TRIAGE_REF: ${{ inputs.triage-ref }}
        run: |
          if [[ ! "$TRIAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "triage-repository must be owner/repo" >&2
            exit 1
          fi
          if [[ ! "$TRIAGE_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "triage-ref contains unsupported characters" >&2
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "failure-triage @ git+https://github.com/${TRIAGE_REPOSITORY}.git@${TRIAGE_REF}"

      - name: Download triage artifacts
        uses: actions/download-artifact@v4
        with:
          name: triage-artifacts
          path: .

      - name: Publish drafts
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          REPOSITORY: ${{ inputs.repository }}
          CONFIG_PATH: ${{ inputs.config-path }}
          DRY_RUN_PUBLISH: ${{ inputs.dry-run-publish }}
          PR_NUMBER: ${{ needs.collect-and-classify.outputs.pull_number }}
        run: |
          test -f bundles/drafts.json
          REPO="$REPOSITORY"
          if [ -z "$REPO" ]; then
            REPO="${GITHUB_REPOSITORY}"
          fi
          ARGS=(
            --drafts bundles/drafts.json
            --repo "$REPO"
            --config "$CONFIG_PATH"
          )
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pull number must be numeric" >&2
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            ARGS+=(--pull "$PR_NUMBER")
          fi
          if [ "$DRY_RUN_PUBLISH" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          triage publish "${ARGS[@]}"

      - name: Upload publish audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-publish-audit
          path: .triage/audit.jsonl
          if-no-files-found: ignore
