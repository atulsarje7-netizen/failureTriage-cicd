name: Fault scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario id from faults/manifest.yaml (python -m faults list)
        required: true
        type: string

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_LOG_PATH: logs/app.log
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: Run scenario
        run: python -m faults execute "$SCENARIO" --ci
        continue-on-error: true

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-scenario
          path: |
            test-results/
            logs/
            tests/ui/test-results/
            tests/ui/playwright-report/
          if-no-files-found: warn

      - name: Record failed run
        if: always()
        run: python -m faults gate
