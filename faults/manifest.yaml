# Ground truth for injected failures. Each entry is one CI scenario.
# Run one with: python -m faults execute <id>
version: 1
scenarios:
- id: product-checkout-500
  label: product_bug
  tags:
  - api
  - ui
  - cross-layer
  - http-5xx
  flow_id: checkout
  stage: test
  summary: A non-empty checkout raises HTTP 500, so the API and UI checkout tests both fail.
  services: []
  run:
    api: full
    ui: full
  expect:
    api_failed:
    - tests/api/test_orders.py::test_checkout_creates_order_and_clears_cart
    api_passed:
    - tests/api/test_orders.py::test_checkout_empty_cart
    - tests/api/test_products.py::test_list_products
    - tests/api/test_auth.py::test_login_success
    ui_failed:
    - checkout places an order visible in history
    ui_passed:
    - catalog lists seeded products
    - alice can log in and reach the catalog
  patch: scenarios/product-checkout-500.patch
- id: product-login-rejects-password
  label: product_bug
  tags:
  - api
  - ui
  - cross-layer
  - auth
  - http-4xx
  flow_id: login
  stage: test
  summary: The real demo password is rejected, so API and UI login both fail while a wrong password still
    returns 401.
  services: []
  run:
    api: full
    ui: full
  expect:
    api_failed:
    - tests/api/test_auth.py::test_login_success
    api_passed:
    - tests/api/test_auth.py::test_login_rejects_bad_password
    - tests/api/test_auth.py::test_me_requires_auth
    - tests/api/test_products.py::test_list_products
    ui_failed:
    - alice can log in and reach the catalog
    ui_passed:
    - wrong password shows an error
    - guest can open login
    - catalog lists seeded products
  patch: scenarios/product-login-rejects-password.patch
