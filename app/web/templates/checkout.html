{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h1 data-testid="checkout-heading">Checkout</h1>
{% if cart.items %}
<p data-testid="checkout-total">Pay ${{ '%.2f'|format(cart.total_cents / 100) }}</p>
<form data-testid="checkout-form" method="post" action="/checkout/place">
  {% include "partials/csrf.html" %}
  <button type="submit" data-testid="place-order">Place order</button>
</form>
{% else %}
<p data-testid="checkout-empty">Nothing to check out.</p>
<a href="/catalog">Back to catalog</a>
{% endif %}
{% endblock %}
