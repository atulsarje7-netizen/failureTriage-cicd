[project]
name = "failure-triage"
version = "0.0.0"
description = "CI failure triage agent for API and UI tests"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["triage", "tests/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["triage"]
