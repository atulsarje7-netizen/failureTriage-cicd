[project]
name = "failure-triage"
version = "0.9.0"
description = "CI failure triage agent for API and UI tests"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "typer>=0.12",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
triage = "triage.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests/api", "tests/triage"]
pythonpath = ["."]
markers = [
    "flow(name): shop flow id for pairing API and UI tests later",
    "app: test boots the shop app through api_client",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "triage", "faults", "tests/api", "tests/triage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "triage", "faults", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["triage", "app", "faults"]
