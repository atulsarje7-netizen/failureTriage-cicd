name: failure-triage

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db", "app"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  payment:
    build: .
    profiles: ["pay", "app"]
    environment:
      PAYMENT_STUB_MODE: ${PAYMENT_STUB_MODE:-ok}
      PAYMENT_STUB_DELAY_MS: ${PAYMENT_STUB_DELAY_MS:-0}
      PAYMENT_STUB_TOKEN: ${PAYMENT_STUB_TOKEN:-dev-token}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.payment_stub.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@postgres:5432/shop
      PAYMENT_URL: http://payment:8001
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-dev-token}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-password}
      APP_LOG_PATH: /tmp/app.log
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      payment:
        condition: service_healthy
