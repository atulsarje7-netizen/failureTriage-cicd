# Repo-specific settings for the triage agent.
# The agent must not import from app/ or tests/; everything local lives here.

ci:
  provider: github_actions
  # repository: owner/repo   # set for `triage collect run` without --repo

paths:
  product: [app/]
  product_ui: [app/web/]
  test: [tests/]
  config: [triage.config.yaml, docker-compose.yml]
  infra: [.github/, Dockerfile]
  dependency:
    - pyproject.toml
    - tests/ui/package.json
    - tests/ui/package-lock.json

artifacts:
  api_junit: test-results/api/junit.xml
  api_exchanges: test-results/api/exchanges
  ui_report: tests/ui/test-results/results.json
  ui_results_dir: tests/ui/test-results
  app_log: logs/app.log
  scenario_json: test-results/scenario/scenario.json
  scenario_diff: test-results/scenario/scenario.diff

# Fallback when a report omits flow_id (JUnit without properties, older artifacts).
flow_path_rules:
  - pattern: tests/api/test_auth.py
    flow_id: login
  - pattern: tests/api/test_products.py
    flow_id: catalog
  - pattern: tests/api/test_cart.py
    flow_id: cart
  - pattern: tests/api/test_orders.py
    flow_id: checkout
  - pattern: tests/api/test_health.py
    flow_id: health
  - pattern: tests/api/test_web_security.py
    flow_id: cart
  - pattern: login.spec.ts
    flow_id: login
  - pattern: catalog.spec.ts
    flow_id: catalog
  - pattern: cart.spec.ts
    flow_id: cart
  - pattern: checkout.spec.ts
    flow_id: checkout
  - pattern: demo-fail.spec.ts
    flow_id: login

services:
  app:
    health_endpoint: /health
  payment:
    health_endpoint: /health
  database:
    engine: postgres

thresholds:
  abstain_below: 0.75
  max_tool_calls: 12

# Allow-listed reruns of test ids that appear in the evidence bundle.
# Off by default for offline replay; enable in CI or pass --verify.
verify:
  enabled: false
  same_sha_attempts: 3
  last_green: true
  repo_root: .
  ui_cwd: tests/ui
  timeout_seconds: 120

# Weights for the composite confidence score (uncalibrated until Evals E6).
confidence:
  weight_rule: 0.4
  weight_rerun: 0.4
  weight_sample: 0.2
  llm_samples: 1

# Provider credentials stay in local .env (gitignored), never in this file.
llm:
  provider: gemini
  model: gemini-3.5-flash-lite

publish:
  pr_comment: true
  draft_issue: true
  draft_issue_label: triage:draft

# Cross-run history (SQLite). Flakiness is reported; the agent never quarantines.
history:
  enabled: true
  path: .triage/history.db
  quarantine_recommend_at: 0.3

# Per-run ceilings. Exceeding any limit stops the run cleanly with needs_human.
budgets:
  max_latency_ms: 120000
  max_tokens: 200000
  max_cost_usd: 0.50
  input_cost_per_1m: 0.10
  output_cost_per_1m: 0.40

audit:
  enabled: true
  path: .triage/audit.jsonl

feedback:
  path: .triage/feedback.jsonl
